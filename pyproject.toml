[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trener"
version = "2.0.0"
description = "Virtuálny tréner klikov: Telegram + Apple Pripomienky (CalDAV) + tabuľka na OMV"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "python-telegram-bot[job-queue]>=22,<23",
    "openpyxl>=3.1,<4",
    "icalendar>=6,<7",
    "smbprotocol>=1.13,<2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "radicale>=3.3"]

[project.scripts]
trener = "trener.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/trener"]

[tool.pytest.ini_options]
testpaths = ["tests"]
